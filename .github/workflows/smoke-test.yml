name: Smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Any finished race works; a full one exercises every event type.
  ARCHIVE_PATH: 2026/2026-03-29_Japanese_Grand_Prix/2026-03-29_Race

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor from pyproject's requires-python, plus current stable.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync --extra dev

      # F1's timing archive is unofficial and not ours to redistribute, so it is
      # fetched instead of committed. The cache keeps a CDN outage off the merge
      # path; when the fetch fails anyway the replay downgrades to a warning and
      # the offline checks still gate the merge.
      - id: archive
        uses: actions/cache@v6
        with:
          path: archive
          key: f1-archive-${{ env.ARCHIVE_PATH }}

      - name: Download archive
        if: steps.archive.outputs.cache-hit != 'true'
        continue-on-error: true
        run: uv run -m f1live.download --path "$ARCHIVE_PATH" -o archive --skip-telemetry

      - run: uv run --extra dev dev/smoke-test.py archive --skip-if-unavailable
