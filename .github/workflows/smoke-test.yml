name: Smoke test

on:
  # Docs and data/ carry no Python — the auto-update bots touch only those, and
  # their GITHUB_TOKEN PRs would otherwise sit waiting for manual approval.
  pull_request:
    paths-ignore: ["data/**", "**.md", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["data/**", "**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor from pyproject's requires-python, plus current stable.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync --extra dev

      # Fully offline: the replay runs on a generated fixture, since F1's archive
      # is neither ours to commit nor reachable from CI (their CDN 403s cloud egress).
      - run: uv run --extra dev dev/smoke-test.py
        env:
          # Some shells set this (honoured from Python 3.11). `-m f1live.*` must
          # then resolve through the installed package, never the working directory.
          PYTHONSAFEPATH: "1"
