name: Codex probe

# Temporary: diagnosing the storylines fact-check hang (run 34125483096).
# Delete once resolved.
#
# codex reports "no credits remaining" while the account shows plenty left.
# ChatGPT subscription usage and platform API credit are separate wallets,
# and the workflow spends the latter. This asks the API directly, without
# spending anything meaningful.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: What does the API say about this key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "key fingerprint: ${OPENAI_API_KEY:0:7}...${OPENAI_API_KEY: -4} (len ${#OPENAI_API_KEY})"

          echo
          echo "=== GET /v1/models (free, proves auth) ==="
          curl -sS -o /tmp/models.json -w 'http %{http_code}\n' \
            https://api.openai.com/v1/models \
            -H "Authorization: Bearer $OPENAI_API_KEY"
          head -c 400 /tmp/models.json; echo

          echo
          echo "=== POST /v1/responses, 1 token (smallest possible spend) ==="
          curl -sS -D /tmp/h.txt -o /tmp/r.json -w 'http %{http_code}\n' \
            https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"gpt-5.6-sol","input":"hi","max_output_tokens":16}'
          echo "--- rate-limit / quota headers ---"
          grep -iE 'x-ratelimit|retry-after|x-request-id' /tmp/h.txt || echo "(none present)"
          echo "--- body ---"
          head -c 700 /tmp/r.json; echo
