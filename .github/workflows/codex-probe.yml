name: Codex probe

# Temporary: bisects the storylines fact-check hang (run 34125483096).
# Delete once the cause is pinned down.
#
# Ruled out so far: the CLI's default-model switch (0.153.4 → gpt-6-astra),
# Astra itself, the preceding claude-code-action step, and input size — the
# real 557-line / 24-URL fixture fact-checks locally in 9m16s. What is left
# is where the fetches originate. The run that hung cites formula1.com,
# planetf1, espn and aljazeera; the last run that passed cited none of them.
# So: can a GitHub runner actually reach these, and how fast?

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run id holding the storylines-factcheck-inputs artifact"
        default: "34148567142"

permissions:
  contents: read
  actions: read

jobs:
  reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch the source list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
            -n storylines-factcheck-inputs -D fixture
          grep -ho 'https\?://[^ )]*' fixture/storylines-sources.md | sort -u > urls.txt
          echo "$(wc -l < urls.txt) unique urls"

      - name: Probe each URL from the runner
        run: |
          printf '%-6s %-9s %-9s %s\n' CODE TIME SIZE URL
          while read -r url; do
            out=$(curl -sSL -o /dev/null \
                    -w '%{http_code} %{time_total} %{size_download}' \
                    --max-time 45 "$url" 2>&1) || out="ERR($?) - -"
            printf '%-6s %-9s %-9s %s\n' $out "$url"
          done < urls.txt

      - name: Probe again with a browser UA
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36'
          printf '%-6s %-9s %-9s %s\n' CODE TIME SIZE URL
          while read -r url; do
            out=$(curl -sSL -o /dev/null -A "$UA" \
                    -w '%{http_code} %{time_total} %{size_download}' \
                    --max-time 45 "$url" 2>&1) || out="ERR($?) - -"
            printf '%-6s %-9s %-9s %s\n' $out "$url"
          done < urls.txt
