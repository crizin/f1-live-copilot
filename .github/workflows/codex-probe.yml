name: Codex probe

# Temporary: bisects the storylines fact-check hang (run 34125483096).
# Delete once the cause is pinned down.
#
# Ruled out: the CLI's default-model switch, Astra itself, the preceding
# claude-code-action step, input size, and network reachability (all 21
# source URLs answer 200 in under a second from a runner).
#
# Live hypothesis: how the pages get read. Locally the model pipes each
# fetch through `rg -C 3` and finishes in 9m16s — but ripgrep is ABSENT on
# GitHub runners, and the 8/31 CI log shows whole raw pages inline instead.
# 21 sources x ~300KB of HTML is a context blowout, which would look exactly
# like the hang. Three variants isolate it.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run id holding the storylines-factcheck-inputs artifact"
        default: "34148567142"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # One variant at a time: each run is a full 21-URL fact-check, and
          # burning the 5-hour quota is what we are trying to observe.
          - label: baseline-no-ripgrep
            ripgrep: "false"
            fetch_hint: "false"
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v7

      - name: Install ripgrep
        if: matrix.ripgrep == 'true'
        run: sudo apt-get install -y -qq ripgrep && rg --version | head -1

      - name: Fetch the real fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
            -n storylines-factcheck-inputs -D /tmp/fixture
          cp /tmp/fixture/storylines.diff /tmp/storylines.diff
          cp /tmp/fixture/storylines-sources.md /tmp/storylines-sources.md
          mkdir -p "$RUNNER_TEMP/codex-home"
          cat > "$RUNNER_TEMP/codex-home/config.toml" <<'TOML'
          [sandbox_workspace_write]
          network_access = true
          TOML

      - name: Build the prompt
        env:
          FETCH_HINT: ${{ matrix.fetch_hint }}
        run: |
          cat > "$RUNNER_TEMP/prompt.txt" <<'PROMPT'
          You are fact-checking a draft update to data/storylines.md
          (F1 2026 narrative content) before it becomes a PR.

          Inputs on disk:
          - /tmp/storylines.diff          — the draft's diff for that file
          - /tmp/storylines-sources.md    — the sources the generator claims
                                            to have used (### blocks with URLs)

          For each substantive new or materially changed claim in the diff:
          1. State the claim in one line of plain English.
          2. Find its source URLs in the sources file.
          3. Fetch each URL and read it.
          4. Classify alignment: VERIFIED / PARTIAL / UNSUPPORTED / CONTRADICTED

          Output STRICTLY in this markdown format. No preamble, no extra prose:

          | Status | Claim | Source check |
          |---|---|---|

          End with one summary line:
          **Summary:** Verified A · Partial B · Unsupported C · Contradicted D

          Rules:
          - Be conservative — if unsure, mark PARTIAL.
          - Do NOT judge writing style; only facts.
          - Do NOT search for new sources beyond what the sources file lists.
          - Skip cosmetic edits (whitespace, the "Last update" line, etc.).
          - Ignore pure deletions — the draft prunes stale entries on
            purpose. Only check claims that are new or changed.
          PROMPT
          if [ "$FETCH_HINT" = "true" ]; then
            cat >> "$RUNNER_TEMP/prompt.txt" <<'HINT'
          - These pages are 200-400KB of HTML each. NEVER read one whole into
            context. Always strip and narrow in the same command, e.g.
              curl -sL --max-time 20 "<url>" | sed -e 's/<[^>]*>//g' \
                | grep -i -B2 -A4 '<keyword>' | head -60
            Two or three keyword probes per page is enough; if that does not
            settle the claim, mark it PARTIAL and move on.
          HINT
          fi
          echo "prompt: $(wc -l < "$RUNNER_TEMP/prompt.txt") lines"

      - name: Codex fact-check (direct CLI, logged)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm install -g "@openai/codex@0.153.4" >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          printenv OPENAI_API_KEY | codex login --with-api-key
          codex login status || true
          set +e
          date -u +"start %H:%M:%S"
          timeout --kill-after=30 900 \
            codex exec --skip-git-repo-check --cd "$GITHUB_WORKSPACE" \
              -m gpt-5.6-sol \
              --config model_reasoning_effort="high" \
              --config web_search="live" \
              --sandbox workspace-write \
              --output-last-message /tmp/codex-review.md \
              "$(cat "$RUNNER_TEMP/prompt.txt")" < /dev/null > /tmp/codex-exec.log 2>&1
          echo "codex exit: $?  (124 = timed out)"
          date -u +"end %H:%M:%S"

      - name: What did it actually do
        if: always()
        run: |
          echo "log: $(wc -lc < /tmp/codex-exec.log 2>/dev/null || echo missing)"
          echo "=== shell commands it ran ==="
          grep -oE "/bin/(ba)?sh -lc .{0,200}" /tmp/codex-exec.log | head -40
          echo "=== last 40 lines ==="
          tail -40 /tmp/codex-exec.log 2>/dev/null | cut -c1-300

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-direct-log
          path: /tmp/codex-exec.log
          if-no-files-found: warn

      - name: Report
        if: always()
        run: |
          tail -6 /tmp/codex-review.md 2>/dev/null || echo "(no output file)"
