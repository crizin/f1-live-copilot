[project]
name = "f1-live-copilot"
version = "0.1.6"
description = "F1 Live Copilot — AI-powered real-time F1 race commentary"
requires-python = ">=3.10"
dependencies = [
    "websockets>=16.1.1",
    "requests>=2.31",
    "openai>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "f1live"
module-root = ""
